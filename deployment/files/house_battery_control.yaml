# One-time SolisCloud commissioning is complete: EMS is disabled, Feed-In
# Priority is commissioned, Peak Shaving and Feed-In Power Limit are disabled.

battery:
  capacity_kwh: 32.1536
  minimum_soc_percent: 10
  charge_efficiency: 0.95
  discharge_efficiency: 0.95
  reserve_margin_kwh: 2

tariff:
  import_rates_entity_id: sensor.octopus_energy_electricity_21l4421345_2700007165105_fused_day_rates
  export_rates_entity_id: sensor.octopus_energy_electricity_21l4421345_2700009249389_fused_export_day_rates

solar:
  config_entry_id: 79c4415a9ea776404127c1b61ba240cf

cycle_discharge_duration_entity_id: input_number.house_battery_cycle_discharge_duration_minutes

solis:
  # Candidate continuous midnight boundary; confirm 24:00 live before release.
  # Use 23:59 only if commissioned, accepting its explicit one-minute gap.
  midnight_end: "24:00"
  telemetry:
    state_of_charge_entity_id: sensor.garage_inverter_telemetry_garage_inverter_remaining_battery_capacity
    battery_power_entity_id: sensor.garage_inverter_telemetry_garage_inverter_battery_power
    battery_power_sign: positive_means_charging
    battery_voltage_entity_id: sensor.garage_inverter_telemetry_garage_inverter_battery_voltage
    device_timestamp_entity_id: sensor.garage_inverter_telemetry_garage_inverter_timestamp_measurements_received
  persistent:
    storage_mode_entity_id: select.garage_inverter_control_storage_mode
    allow_grid_charging_entity_id: switch.garage_inverter_control_allow_grid_charging
    inverter_time_entity_id: datetime.garage_inverter_control_inverter_time
  protection:
    battery_reserve_entity_id: switch.garage_inverter_control_battery_reserve
    battery_reserve_soc_entity_id: number.garage_inverter_control_battery_reserve_soc
  capability:
    battery_max_charge_current_entity_id: number.garage_inverter_control_battery_max_charge_current
    battery_max_discharge_current_entity_id: number.garage_inverter_control_battery_max_discharge_current
  slot_entity_prefix: garage_inverter_control
  slot_allocations:
    cheap_charging: [1, 2]
    full_soc_cycling: [1, 3]
    reserve_export: [2, 4]
