# One-time SolisCloud commissioning: EMS is disabled for this plant so cloud
# dispatch cannot overwrite Home Assistant inverter controls.
battery:
  capacity_kwh: 32.1536
  minimum_state_of_charge_percent: 10
  charge_efficiency: 0.95
  discharge_efficiency: 0.95
  power_limit_entity_id: input_number.house_battery_power_limit

tariff:
  import_price_entity_id: sensor.octopus_energy_electricity_21l4421345_2700007165105_fused_day_rates
  export_price_entity_id: sensor.octopus_energy_electricity_21l4421345_2700009249389_export_current_rate

solar:
  config_entry_id: 79c4415a9ea776404127c1b61ba240cf

policy:
  reserve_margin_entity_id: input_number.house_battery_reserve_margin
  export_hysteresis_entity_id: input_number.house_battery_export_hysteresis

control_disable_guard_entity_id: input_boolean.house_battery_control_disable

# T0011 commissioning is deliberately disabled.  The workflow only emits a
# copy of this shape for human review; it never persists an enabled authority.
candidate_commissioning:
  services_enabled: false
  persistent_candidate_authorization: null
  candidate_mapping_fingerprint: null
  candidate_policy_fingerprint: null
  candidate_validated_at: null
  manual_grid_verification: null
  capability_resolutions: []
  commissioned_power_envelope: null

# The live Solis map is authoritative for battery telemetry and the later
# guarded controller cutover.  The shared power-limit helper above remains an
# observation-only diagnostic input until T0013 replaces that capability input.
solis:
  telemetry:
    state_of_charge_entity_id: sensor.garage_inverter_telemetry_garage_inverter_remaining_battery_capacity
    # These are unresolved live facts; T0004 must block healthy actuation until
    # they have been identified and validated.
    battery_power_entity_id: null
    battery_power_sign: null
    device_timestamp_entity_id: null

  persistent:
    storage_mode_entity_id: select.garage_inverter_control_storage_mode
    allow_grid_charging_entity_id: switch.garage_inverter_control_allow_grid_charging
    allow_export_entity_id: switch.garage_inverter_control_allow_export
    grid_peak_shaving_entity_id: switch.garage_inverter_control_grid_peak_shaving
    inverter_on_off_entity_id: switch.garage_inverter_control_inverter_on_off
    inverter_time_entity_id: datetime.garage_inverter_control_inverter_time

  protection:
    battery_over_discharge_soc_entity_id: number.garage_inverter_control_battery_over_discharge_soc
    battery_force_charge_soc_entity_id: number.garage_inverter_control_battery_force_charge_soc
    battery_recovery_soc_entity_id: number.garage_inverter_control_battery_recovery_soc
    battery_max_charge_soc_entity_id: number.garage_inverter_control_battery_max_charge_soc
    battery_reserve_entity_id: switch.garage_inverter_control_battery_reserve
    battery_reserve_soc_entity_id: number.garage_inverter_control_battery_reserve_soc

  capability:
    battery_max_charge_current_entity_id: number.garage_inverter_control_battery_max_charge_current
    battery_max_discharge_current_entity_id: number.garage_inverter_control_battery_max_discharge_current
    max_output_power_entity_id: number.garage_inverter_control_max_output_power
    max_export_power_entity_id: number.garage_inverter_control_max_export_power

  # Solis Cloud Control v2.21.0 exposes no entity for this setting.  It must
  # be commissioned and verified directly on the inverter, never written as an
  # entity service call.
  maximum_grid_import_policy: manual_commissioning

  # Every physical slot is mapped for reconciliation and cleanup.  Reserved
  # directions are intentionally not enabled by the MVP controller.
  slots:
    - physical_slot: 1
      charge:
        enable_entity_id: switch.garage_inverter_control_slot1_charge
        time_entity_id: text.garage_inverter_control_slot1_charge_time
        current_entity_id: number.garage_inverter_control_slot1_charge_current
        target_soc_entity_id: number.garage_inverter_control_slot1_charge_soc
        owner: cheap_charging
      discharge:
        enable_entity_id: switch.garage_inverter_control_slot1_discharge
        time_entity_id: text.garage_inverter_control_slot1_discharge_time
        current_entity_id: number.garage_inverter_control_slot1_discharge_current
        target_soc_entity_id: number.garage_inverter_control_slot1_discharge_soc
        owner: full_soc_cycling
    - physical_slot: 2
      charge:
        enable_entity_id: switch.garage_inverter_control_slot2_charge
        time_entity_id: text.garage_inverter_control_slot2_charge_time
        current_entity_id: number.garage_inverter_control_slot2_charge_current
        target_soc_entity_id: number.garage_inverter_control_slot2_charge_soc
        owner: reserved
      discharge:
        enable_entity_id: switch.garage_inverter_control_slot2_discharge
        time_entity_id: text.garage_inverter_control_slot2_discharge_time
        current_entity_id: number.garage_inverter_control_slot2_discharge_current
        target_soc_entity_id: number.garage_inverter_control_slot2_discharge_soc
        owner: pre_discharge
    - physical_slot: 3
      charge:
        enable_entity_id: switch.garage_inverter_control_slot3_charge
        time_entity_id: text.garage_inverter_control_slot3_charge_time
        current_entity_id: number.garage_inverter_control_slot3_charge_current
        target_soc_entity_id: number.garage_inverter_control_slot3_charge_soc
        owner: reserved
      discharge:
        enable_entity_id: switch.garage_inverter_control_slot3_discharge
        time_entity_id: text.garage_inverter_control_slot3_discharge_time
        current_entity_id: number.garage_inverter_control_slot3_discharge_current
        target_soc_entity_id: number.garage_inverter_control_slot3_discharge_soc
        owner: reserved
    - physical_slot: 4
      charge:
        enable_entity_id: switch.garage_inverter_control_slot4_charge
        time_entity_id: text.garage_inverter_control_slot4_charge_time
        current_entity_id: number.garage_inverter_control_slot4_charge_current
        target_soc_entity_id: number.garage_inverter_control_slot4_charge_soc
        owner: reserved
      discharge:
        enable_entity_id: switch.garage_inverter_control_slot4_discharge
        time_entity_id: text.garage_inverter_control_slot4_discharge_time
        current_entity_id: number.garage_inverter_control_slot4_discharge_current
        target_soc_entity_id: number.garage_inverter_control_slot4_discharge_soc
        owner: reserved
    - physical_slot: 5
      charge:
        enable_entity_id: switch.garage_inverter_control_slot5_charge
        time_entity_id: text.garage_inverter_control_slot5_charge_time
        current_entity_id: number.garage_inverter_control_slot5_charge_current
        target_soc_entity_id: number.garage_inverter_control_slot5_charge_soc
        owner: reserved
      discharge:
        enable_entity_id: switch.garage_inverter_control_slot5_discharge
        time_entity_id: text.garage_inverter_control_slot5_discharge_time
        current_entity_id: number.garage_inverter_control_slot5_discharge_current
        target_soc_entity_id: number.garage_inverter_control_slot5_discharge_soc
        owner: reserved
    - physical_slot: 6
      charge:
        enable_entity_id: switch.garage_inverter_control_slot6_charge
        time_entity_id: text.garage_inverter_control_slot6_charge_time
        current_entity_id: number.garage_inverter_control_slot6_charge_current
        target_soc_entity_id: number.garage_inverter_control_slot6_charge_soc
        owner: reserved
      discharge:
        enable_entity_id: switch.garage_inverter_control_slot6_discharge
        time_entity_id: text.garage_inverter_control_slot6_discharge_time
        current_entity_id: number.garage_inverter_control_slot6_discharge_current
        target_soc_entity_id: number.garage_inverter_control_slot6_discharge_soc
        owner: reserved
