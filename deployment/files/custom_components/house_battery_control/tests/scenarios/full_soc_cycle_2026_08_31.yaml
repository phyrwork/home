id: full_soc_cycle_2026_08_31
source: "Reduced from the 2026-08-31 overnight cycling incident"
purpose: "Prove rolling adjacent cycle phases and prevent another silent sequential-recharge implementation"
inverter_timezone: Europe/London

cheap_window:
  start: "2026-08-31T00:00:00Z"
  end: "2026-08-31T00:45:00Z"
cycle_duration_minutes: 10

steps:
  - at: "2026-08-31T00:00:00Z"
    soc_percent: 100
    device_timestamp: "2026-08-31T00:00:00Z"
    expect:
      action: CYCLE_DISCHARGE
      cycle_state: CYCLE_DISCHARGING
      cycle_deadline: "2026-08-31T00:10:00Z"
      enable_order: [charge, discharge]
      native_times:
        discharge: "01:00-01:10"
        charge: "01:10-01:20"
      segments:
        - owner: full_soc_cycling
          direction: discharge
          start: "2026-08-31T00:00:00Z"
          end: "2026-08-31T00:10:00Z"
        - owner: cheap_charging
          direction: charge
          start: "2026-08-31T00:10:00Z"
          end: "2026-08-31T00:20:00Z"

  - at: "2026-08-31T00:05:00Z"
    soc_percent: 100
    device_timestamp: "2026-08-31T00:00:00Z"
    expect:
      action: CYCLE_DISCHARGE
      cycle_state: CYCLE_DISCHARGING
      cycle_deadline: "2026-08-31T00:10:00Z"
      no_slot_writes: true
      segments:
        - owner: full_soc_cycling
          direction: discharge
          start: "2026-08-31T00:00:00Z"
          end: "2026-08-31T00:10:00Z"
        - owner: cheap_charging
          direction: charge
          start: "2026-08-31T00:10:00Z"
          end: "2026-08-31T00:20:00Z"

  - at: "2026-08-31T00:10:05Z"
    soc_percent: 98
    device_timestamp: "2026-08-31T00:10:00Z"
    expect:
      action: CYCLE_RECHARGE
      cycle_state: CYCLE_RECHARGING
      cycle_deadline: "2026-08-31T00:20:00Z"
      retained_direction: charge
      stopped_directions: [discharge]
      native_times:
        discharge: "01:20-01:30"
      segments:
        - owner: cheap_charging
          direction: charge
          start: "2026-08-31T00:10:00Z"
          end: "2026-08-31T00:20:00Z"
        - owner: full_soc_cycling
          direction: discharge
          start: "2026-08-31T00:20:00Z"
          end: "2026-08-31T00:30:00Z"

  - at: "2026-08-31T00:20:05Z"
    soc_percent: 100
    device_timestamp: "2026-08-31T00:20:00Z"
    expect:
      action: CYCLE_DISCHARGE
      cycle_state: CYCLE_DISCHARGING
      cycle_deadline: "2026-08-31T00:30:00Z"
      retained_direction: discharge
      stopped_directions: [charge]
      native_times:
        charge: "01:30-01:40"
      segments:
        - owner: full_soc_cycling
          direction: discharge
          start: "2026-08-31T00:20:00Z"
          end: "2026-08-31T00:30:00Z"
        - owner: cheap_charging
          direction: charge
          start: "2026-08-31T00:30:00Z"
          end: "2026-08-31T00:40:00Z"

  - at: "2026-08-31T00:30:05Z"
    soc_percent: 98
    device_timestamp: "2026-08-31T00:30:00Z"
    expect:
      action: CYCLE_RECHARGE
      cycle_state: CYCLE_RECHARGING
      cycle_deadline: "2026-08-31T00:40:00Z"
      retained_direction: charge
      stopped_directions: [discharge]
      segments:
        - owner: cheap_charging
          direction: charge
          start: "2026-08-31T00:30:00Z"
          end: "2026-08-31T00:40:00Z"

  - at: "2026-08-31T00:40:05Z"
    soc_percent: 100
    device_timestamp: "2026-08-31T00:40:00Z"
