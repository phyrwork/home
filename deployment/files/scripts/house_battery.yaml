house_battery_fail_safe:
  alias: "House battery fail-safe"
  description: >-
    Put the Solis inverter in autonomous Self-Use operation. The guard is
    asserted and read back before any cloud-backed control write. A second
    bounded pass is attempted when the first pass does not settle safely.
  mode: single
  max_exceeded: silent
  sequence:
    - variables:
        guard_entity_id: input_boolean.house_battery_control_disable
        storage_mode_entity_id: select.garage_inverter_control_storage_mode
        battery_reserve_entity_id: switch.garage_inverter_control_battery_reserve
        slot_entity_ids:
          - switch.garage_inverter_control_slot1_charge
          - switch.garage_inverter_control_slot1_discharge
          - switch.garage_inverter_control_slot2_charge
          - switch.garage_inverter_control_slot2_discharge
          - switch.garage_inverter_control_slot3_charge
          - switch.garage_inverter_control_slot3_discharge
          - switch.garage_inverter_control_slot4_charge
          - switch.garage_inverter_control_slot4_discharge
          - switch.garage_inverter_control_slot5_charge
          - switch.garage_inverter_control_slot5_discharge
          - switch.garage_inverter_control_slot6_charge
          - switch.garage_inverter_control_slot6_discharge
        notification_id: house_battery_watchdog

    # Never issue Solis writes unless the local guard has been freshly proved.
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ states(guard_entity_id) != 'on' }}"
          sequence:
            - service: input_boolean.turn_on
              target:
                entity_id: "{{ guard_entity_id }}"
              continue_on_error: true
    - wait_template: "{{ states(guard_entity_id) == 'on' }}"
      timeout:
        seconds: 5
      continue_on_timeout: true
    - condition: template
      value_template: "{{ states(guard_entity_id) == 'on' }}"

    # Cloud-backed writes are deliberately bounded. The readback condition at
    # the end of the pass causes a second pass only when the first did not
    # settle the complete safe state.
    - repeat:
        count: 2
        sequence:
          - variables:
              unsafe_slot_entity_ids: >-
                {{ expand(slot_entity_ids)
                   | rejectattr('state', 'eq', 'off')
                   | map(attribute='entity_id')
                   | list }}
          - repeat:
              for_each: "{{ unsafe_slot_entity_ids }}"
              sequence:
                - service: switch.turn_off
                  target:
                    entity_id: "{{ repeat.item }}"
                  continue_on_error: true
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ states(storage_mode_entity_id) != 'Self-Use' }}"
                sequence:
                  - service: select.select_option
                    target:
                      entity_id: "{{ storage_mode_entity_id }}"
                    data:
                      option: Self-Use
                    continue_on_error: true
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ states(battery_reserve_entity_id) != 'off' }}"
                sequence:
                  - service: switch.turn_off
                    target:
                      entity_id: "{{ battery_reserve_entity_id }}"
                    continue_on_error: true
          - wait_template: >-
              {{ states(guard_entity_id) == 'on'
                 and states(storage_mode_entity_id) == 'Self-Use'
                 and states(battery_reserve_entity_id) == 'off'
                 and (expand(slot_entity_ids) | selectattr('state', 'eq', 'off')
                      | list | length)
                    == (slot_entity_ids | length) }}
            timeout:
              seconds: 10
            continue_on_timeout: true
          - choose:
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ states(guard_entity_id) == 'on'
                         and states(storage_mode_entity_id) == 'Self-Use'
                         and states(battery_reserve_entity_id) == 'off'
                         and (expand(slot_entity_ids) | selectattr('state', 'eq', 'off')
                              | list | length)
                            == (slot_entity_ids | length) }}
                sequence:
                  - stop: "The inverter safe state is proven"

    - service: persistent_notification.create
      data:
        notification_id: "{{ notification_id }}"
        title: "House battery fail-safe is not proven"
        message: >-
          The watchdog asserted the control guard and attempted two bounded
          reconciliation passes, but could not prove Self-Use with all slots
          off. Inspect the Solis controls before enabling dynamic control.
      continue_on_error: true
