sensor:
  - name: Octopus Energy Electricity 21L4421345/2700007165105 Fused Day Rates
    unique_id: octopus_energy_electricity_21l4421345_2700007165105_fused_day_rates
    icon: mdi:chart-line
    availability: >-
      {% set current = states('event.octopus_energy_electricity_21l4421345_2700007165105_current_day_rates') %}
      {% set next = states('event.octopus_energy_electricity_21l4421345_2700007165105_next_day_rates') %}
      {{ not (current == 'unavailable' and next == 'unavailable') }}
    state: >-
      {% set current_rate = states('sensor.octopus_energy_electricity_21l4421345_2700007165105_current_rate') %}
      {% if current_rate in ['unknown', 'unavailable', ''] %}
        unknown
      {% else %}
        {{ current_rate }}
      {% endif %}
    attributes:
      rate_unit: >-
        {{ state_attr('sensor.octopus_energy_electricity_21l4421345_2700007165105_current_rate', 'unit_of_measurement') or 'GBP/kWh' }}
      rates: >-
        {% set ns = namespace(items=[]) %}
        {% for source_day, event_entity in [
          ('current', 'event.octopus_energy_electricity_21l4421345_2700007165105_current_day_rates'),
          ('next', 'event.octopus_energy_electricity_21l4421345_2700007165105_next_day_rates')
        ] %}
          {% set rates_raw = state_attr(event_entity, 'rates') | default('[]', true) %}
          {% set event_rates = (rates_raw | from_json) if (rates_raw is string) else rates_raw %}
          {% set event_ns = namespace(minimum=none, prices=[]) %}
          {% for event_rate in event_rates | list %}
            {% if event_ns.minimum is none or event_rate.value_inc_vat < event_ns.minimum %}
              {% set event_ns.minimum = event_rate.value_inc_vat %}
            {% endif %}
            {% if event_rate.value_inc_vat not in event_ns.prices %}
              {% set event_ns.prices = event_ns.prices + [event_rate.value_inc_vat] %}
            {% endif %}
          {% endfor %}
          {% for rate in event_rates | list %}
            {% set adjusted = rate.is_intelligent_adjusted if ('is_intelligent_adjusted' in rate) else false %}
            {% set classification = 'BONUS_DISPATCH' if (adjusted is sameas true and rate.value_inc_vat == event_ns.minimum) else
              ('STANDARD_CHEAP' if (adjusted is sameas false and rate.value_inc_vat == event_ns.minimum and event_ns.prices | length in [2, 3]) else 'NOT_CHEAP') %}
            {% set ns.items = ns.items + [{
              'start': as_datetime(rate.start).isoformat(),
              'end': as_datetime(rate.end).isoformat(),
              'value_inc_vat': rate.value_inc_vat,
              'is_capped': rate.is_capped,
              'unit': 'GBP/kWh',
              'is_intelligent_adjusted': adjusted,
              'classification': classification,
              'source': 'octopus_energy',
              'source_event': event_entity,
              'source_day': source_day,
              'tariff': state_attr(event_entity, 'tariff_code') or state_attr(event_entity, 'tariff'),
              'event_min_rate': state_attr(event_entity, 'min_rate') if state_attr(event_entity, 'min_rate') is not none else event_ns.minimum,
              'event_unique_price_count': event_ns.prices | length,
              'source_revision_at': as_datetime(states[event_entity].last_changed).isoformat()
            }] %}
          {% endfor %}
        {% endfor %}
        {{ ns.items | tojson }}
      rate_source_entity_id: sensor.octopus_energy_electricity_21l4421345_2700007165105_rates_data_last_retrieved
      rate_source_last_retrieved: >-
        {{ states('sensor.octopus_energy_electricity_21l4421345_2700007165105_rates_data_last_retrieved') }}
      dispatch_source_entity_id: >-
        {% set dispatch_sources = states.sensor
          | selectattr('entity_id', 'match', '^sensor.octopus_energy_.+_intelligent_dispatches_data_last_retrieved$')
          | map(attribute='entity_id') | list %}
        {{ dispatch_sources[0] if dispatch_sources else none }}
      dispatch_source_last_retrieved: >-
        {% set dispatch_sources = states.sensor
          | selectattr('entity_id', 'match', '^sensor.octopus_energy_.+_intelligent_dispatches_data_last_retrieved$')
          | map(attribute='entity_id') | list %}
        {{ states(dispatch_sources[0]) if dispatch_sources else none }}

  - name: Octopus Energy Electricity 21L4421345/2700009249389 Fused Export Day Rates
    unique_id: octopus_energy_electricity_21l4421345_2700009249389_fused_export_day_rates
    icon: mdi:chart-line
    availability: >-
      {% set current = states('event.octopus_energy_electricity_21l4421345_2700009249389_export_current_day_rates') %}
      {% set next = states('event.octopus_energy_electricity_21l4421345_2700009249389_export_next_day_rates') %}
      {{ not (current == 'unavailable' and next == 'unavailable') }}
    state: >-
      {% set current_rate = states('sensor.octopus_energy_electricity_21l4421345_2700009249389_export_current_rate') %}
      {% if current_rate in ['unknown', 'unavailable', ''] %}
        unknown
      {% else %}
        {{ current_rate }}
      {% endif %}
    attributes:
      rate_unit: GBP/kWh
      rates: >-
        {% set ns = namespace(items=[]) %}
        {% for source_day, event_entity in [
          ('current', 'event.octopus_energy_electricity_21l4421345_2700009249389_export_current_day_rates'),
          ('next', 'event.octopus_energy_electricity_21l4421345_2700009249389_export_next_day_rates')
        ] %}
          {% set rates_raw = state_attr(event_entity, 'rates') | default('[]', true) %}
          {% set event_rates = (rates_raw | from_json) if (rates_raw is string) else rates_raw %}
          {% for rate in event_rates | list %}
            {% set ns.items = ns.items + [{
              'start': as_datetime(rate.start).isoformat(),
              'end': as_datetime(rate.end).isoformat(),
              'value_inc_vat': rate.value_inc_vat,
              'is_capped': rate.is_capped,
              'unit': 'GBP/kWh',
              'source': 'octopus_energy',
              'source_event': event_entity,
              'source_day': source_day,
              'tariff': state_attr(event_entity, 'tariff_code') or state_attr(event_entity, 'tariff'),
              'retrieved_at': states('sensor.octopus_energy_electricity_21l4421345_2700009249389_rates_data_last_retrieved')
            }] %}
          {% endfor %}
        {% endfor %}
        {{ ns.items | tojson }}
      rate_source_entity_id: sensor.octopus_energy_electricity_21l4421345_2700009249389_rates_data_last_retrieved
      rate_source_last_retrieved: >-
        {{ states('sensor.octopus_energy_electricity_21l4421345_2700009249389_rates_data_last_retrieved') }}
