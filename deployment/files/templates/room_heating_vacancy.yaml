# Keep existing unique_id values stable when changing entity names or IDs.
binary_sensor:
  - name: Kids Bedroom Heating Vacancy
    unique_id: kids_bedroom_daytime_vacancy
    default_entity_id: binary_sensor.kids_bedroom_heating_vacancy
    state: >
      {% set protection = states.schedule.kids_bedroom_heating_protection %}
      {% set motion = states.binary_sensor.kids_bedroom_motion_sensor %}
      {% set delay = states('input_number.room_heating_vacancy_delay') | int(0) or 60 %}
      {{ protection is not none and protection.state == 'off'
         and motion is not none and motion.state == 'off'
         and now() - ([protection.last_changed, motion.last_changed] | max)
             >= timedelta(minutes=delay) }}
    attributes:
      vacancy_countdown: >
        {% set protection = states.schedule.kids_bedroom_heating_protection %}
        {% set motion = states.binary_sensor.kids_bedroom_motion_sensor %}
        {% set delay = states('input_number.room_heating_vacancy_delay') | int(0) or 60 %}
        {% if protection is not none and protection.state == 'off' and motion is not none and motion.state == 'off' %}
          {% set due = as_timestamp(([protection.last_changed, motion.last_changed] | max)) + delay * 60 %}
          {% set remaining = (due - as_timestamp(now())) / 60 %}
          {% set protection_start = as_timestamp(protection.attributes.get('next_event'), none) %}
          {{ 'Vacancy in ' ~ (remaining | round(0, 'ceil') | int) ~ ' min'
             if remaining > 0 and (protection_start is none or due < protection_start) else none }}
        {% else %}
          {{ none }}
        {% endif %}

