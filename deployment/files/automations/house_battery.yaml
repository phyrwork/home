- id: house_battery_independent_watchdog
  alias: "House battery independent watchdog"
  description: >-
    Latch the independent fail-safe for a hard controller failure or a dead
    heartbeat. Fresh degraded operation remains recoverable.
  mode: single
  max_exceeded: silent
  trigger:
    - platform: time_pattern
      minutes: "/1"
      id: every_minute
    - platform: state
      entity_id: sensor.house_battery_control_health
      id: controller_health_changed
    - platform: state
      entity_id: sensor.house_battery_control_health
      to: unavailable
      for: "00:10:00"
      id: controller_unavailable
    - platform: state
      entity_id: sensor.house_battery_control_health
      to: unknown
      for: "00:10:00"
      id: controller_unknown
    - platform: state
      entity_id: input_boolean.house_battery_control_disable
      id: control_disable_changed
  condition:
    - condition: template
      value_template: >-
        {% set heartbeat = as_timestamp(states('sensor.house_battery_control_heartbeat'), default=none) %}
        {% set health = states('sensor.house_battery_control_health') %}
        {% set health_state = states.sensor.house_battery_control_health %}
        {% set health_changed = as_timestamp(health_state.last_changed, default=none) %}
        {{ (trigger.id == 'control_disable_changed'
               and states('input_boolean.house_battery_control_disable') != 'off')
           or health == 'fail_safe'
           or trigger.id in ['controller_unavailable', 'controller_unknown']
           or (heartbeat is none
               and health in ['unavailable', 'unknown']
               and health_changed is not none
               and (as_timestamp(now()) - health_changed) > 600)
           or (heartbeat is not none
               and ((as_timestamp(now()) - heartbeat) > 180
                    or (heartbeat - as_timestamp(now())) > 60)) }}
  action:
    - service: script.turn_on
      target:
        entity_id: script.house_battery_fail_safe
