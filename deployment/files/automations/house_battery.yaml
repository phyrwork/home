- id: house_battery_stale_heartbeat_sentinel
  alias: "House battery stale heartbeat sentinel"
  description: >-
    Select Self-Use only when the controller heartbeat remains stale after the
    Home Assistant startup grace period.
  mode: single
  max_exceeded: silent
  trigger:
    - platform: homeassistant
      event: start
      id: startup_grace
    - platform: time_pattern
      minutes: "/1"
      id: every_minute
  condition:
    - condition: or
      conditions:
        - condition: trigger
          id: startup_grace
        - condition: template
          value_template: >-
            {% set heartbeat = as_timestamp(states('sensor.house_battery_control_heartbeat'), default=none) %}
            {{ heartbeat is none
               or (as_timestamp(now()) - heartbeat) > 180
               or (heartbeat - as_timestamp(now())) > 60 }}
  action:
    - choose:
        - conditions:
            - condition: trigger
              id: startup_grace
          sequence:
            - delay:
                minutes: 10
    - condition: template
      value_template: >-
        {% set heartbeat = as_timestamp(states('sensor.house_battery_control_heartbeat'), default=none) %}
        {{ heartbeat is none
           or (as_timestamp(now()) - heartbeat) > 180
           or (heartbeat - as_timestamp(now())) > 60 }}
    - condition: template
      value_template: >-
        {{ states('select.garage_inverter_control_storage_mode') != 'Self-Use' }}
    - service: select.select_option
      target:
        entity_id: select.garage_inverter_control_storage_mode
      data:
        option: Self-Use
