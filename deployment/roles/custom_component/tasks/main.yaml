- name: Ensure custom_components directory exists
  ansible.builtin.file:
    path: "{{ ha_custom_components_dir }}"
    state: directory
    mode: "0755"

- name: Set custom component paths
  ansible.builtin.set_fact:
    component_source_id: >-
      {{ component_full_name }}@{{ component_version }}{{
        '#zip' if component_archive_format | default('tar.gz') == 'zip' else ''
      }}
    component_archive_path: >-
      /tmp/{{ component_domain }}-{{ component_version | regex_replace('[^A-Za-z0-9_.-]', '_') }}.{{
        'zip' if component_archive_format | default('tar.gz') == 'zip' else 'tar.gz'
      }}
    component_download_url: >-
      {{ component_archive_url | default(
        'https://codeload.github.com/' ~ component_full_name ~ '/tar.gz/' ~ component_version
      ) }}
    component_install_path: "{{ ha_custom_components_dir }}/{{ component_domain }}"
    component_extract_path: "{{ ha_custom_components_dir }}/.{{ component_domain }}.extract"

- name: Check deployed custom component source marker
  ansible.builtin.stat:
    path: "{{ component_install_path }}/.deployed-source"
  register: component_source_marker

- name: Read deployed custom component source marker
  ansible.builtin.slurp:
    src: "{{ component_install_path }}/.deployed-source"
  register: component_source_marker_content
  when: component_source_marker.stat.exists

- name: Set deployed custom component source
  ansible.builtin.set_fact:
    component_deployed_source: >-
      {{
        (component_source_marker_content.content | b64decode | trim)
        if component_source_marker.stat.exists
        else ''
      }}

- name: Check installed custom component path
  ansible.builtin.stat:
    path: "{{ component_install_path }}"
    follow: no
  register: component_install_path_stat

- name: Install custom component from pinned archive
  when: >
    component_deployed_source != component_source_id
    or component_install_path_stat.stat.islnk | default(false)
  block:
    - name: Download custom component archive
      ansible.builtin.get_url:
        url: "{{ component_download_url }}"
        dest: "{{ component_archive_path }}"
        mode: "0644"

    - name: Remove stale custom component extract directory
      ansible.builtin.file:
        path: "{{ component_extract_path }}"
        state: absent

    - name: Create custom component extract directory
      ansible.builtin.file:
        path: "{{ component_extract_path }}"
        state: directory
        mode: "0755"

    - name: Extract custom component from archive
      ansible.builtin.shell: |
        archive_root="$(tar -tzf "{{ component_archive_path }}" | sed -n '1p')"
        tar -xzf "{{ component_archive_path }}" \
          -C "{{ component_extract_path }}" \
          --strip-components=3 \
          "${archive_root}custom_components/{{ component_domain }}"
      args:
        executable: /bin/sh
      when: component_archive_format | default('tar.gz') == 'tar.gz'

    - name: Extract custom component from ZIP release
      ansible.builtin.unarchive:
        src: "{{ component_archive_path }}"
        dest: "{{ component_extract_path }}"
        remote_src: true
      when: component_archive_format | default('tar.gz') == 'zip'

    - name: Check custom component exists in archive
      ansible.builtin.stat:
        path: "{{ component_extract_path }}/manifest.json"
      register: component_manifest

    - name: Fail when custom component is missing from archive
      ansible.builtin.fail:
        msg: >-
          {{ component_full_name }} does not contain
          custom_components/{{ component_domain }}/manifest.json
          at {{ component_version }}
      when: not component_manifest.stat.exists

    - name: Remove existing custom component install directory
      ansible.builtin.file:
        path: "{{ component_install_path }}"
        state: absent

    - name: Move extracted custom component into Home Assistant config
      ansible.builtin.command:
        argv:
          - mv
          - "{{ component_extract_path }}"
          - "{{ component_install_path }}"
      notify: restart ha

    - name: Write deployed custom component source marker
      ansible.builtin.copy:
        content: "{{ component_source_id }}\n"
        dest: "{{ component_install_path }}/.deployed-source"
        mode: "0644"

    - name: Remove downloaded custom component archive
      ansible.builtin.file:
        path: "{{ component_archive_path }}"
        state: absent

- name: Install custom component overlay
  ansible.builtin.copy:
    src: "{{ component_overlay_dir }}/"
    dest: "{{ component_install_path }}/"
    mode: preserve
  when: component_overlay_dir is defined
  notify: restart ha

- name: Install latest release sensor
  template:
    src: "{{ playbook_dir }}/templates/rest/hacs_latest_release.yaml.j2"
    dest: "{{ ha_config_dir }}/rest/{{ component_domain }}_latest_release.yaml"
  notify: reload core config

- name: Install installed version sensor
  template:
    src: "{{ playbook_dir }}/templates/command_line/hacs_installed_version.yaml.j2"
    dest: "{{ ha_config_dir }}/command_line/{{ component_domain }}_installed_version.yaml"
  notify: reload core config

- name: Install update entity
  template:
    src: "{{ playbook_dir }}/templates/templates/hacs_component_update.yaml.j2"
    dest: "{{ ha_config_dir }}/templates/{{ component_domain }}_update.yaml"
  notify: reload templates
