# Snapshot of the HA-managed Climate dashboard. See README.md for restoration.
title: Climate
views:
- title: Climate
  path: overview
  type: sections
  max_columns: 3
  sections:
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Home
      heading_style: title
      icon: mdi:home
    - type: horizontal-stack
      grid_options:
        columns: full
      cards:
      - type: tile
        entity: binary_sensor.house_heating_away
        name: Household away
        icon: mdi:home-export-outline
        tap_action:
          action: more-info
        icon_tap_action:
          action: more-info
      - type: tile
        entity: switch.house_heating_zone_call_for_heat
        name: House call for heat
        icon: mdi:fire
        tap_action:
          action: more-info
        icon_tap_action:
          action: more-info
  - type: grid
    cards:
    - type: heading
      heading: Landing
      heading_style: title
    - type: tile
      entity: climate.landing
      name: Landing
      state_content:
      - hvac_action
      - current_temperature
      features:
      - type: target-temperature
        style: buttons
      features_position: inline
      grid_options:
        columns: full
      tap_action:
        action: more-info
      icon_tap_action:
        action: more-info
  - type: grid
    cards:
    - type: heading
      heading: Kids’ bedroom
      heading_style: title
    - type: tile
      entity: climate.kids_bedroom_thermostat
      name: Kids’ bedroom
      state_content:
      - hvac_action
      - current_temperature
      features:
      - type: target-temperature
        style: buttons
      features_position: inline
      grid_options:
        columns: full
      tap_action:
        action: more-info
      icon_tap_action:
        action: more-info
    - type: tile
      entity: binary_sensor.kids_bedroom_heating_vacancy
      name: Heating vacancy
      icon: mdi:motion-sensor-off
      color: amber
      tap_action:
        action: more-info
      icon_tap_action:
        action: more-info
      hold_action:
        action: none
      double_tap_action:
        action: none
      state_content:
      - state
      - vacancy_countdown
